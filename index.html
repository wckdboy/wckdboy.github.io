<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="wckdboy's blog">
  <title>wckdboy's blog</title>

  <style>
    :root {
      --header-bg: #e8dcf8;
      --text: #26232b;
      --muted: #6f6878;
      --border: #e7e2ea;
      --link: #6f4aa8;
      --page-width: 720px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.65;
    }

    header {
      background: var(--header-bg);
      padding: 2.5rem 1.25rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.25rem);
      line-height: 1.1;
    }

    header p {
      margin: 0.75rem auto 0;
      max-width: 34rem;
      color: var(--muted);
    }

    main {
      width: min(calc(100% - 2rem), var(--page-width));
      margin: 0 auto;
      padding: 3rem 0;
    }

    article + article {
      margin-top: 3rem;
      padding-top: 3rem;
      border-top: 1px solid var(--border);
    }

    article h2 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.5rem, 5vw, 2rem);
      line-height: 1.25;
    }

    article time {
      display: block;
      margin-bottom: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    a {
      color: var(--link);
    }

    footer {
      width: min(calc(100% - 2rem), var(--page-width));
      margin: 0 auto;
      padding: 2rem 0 3rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>My Blog</h1>
    <p>A simple place for thoughts, notes, and occasional discoveries.</p>
  </header>

  <main>
    <article>
      <h2>My first post</h2>
      <time datetime="2026-08-05">5 August 2026</time>

      <p>
        This is the opening paragraph of your post. Replace it with your own
        writing.
      </p>

      <p>
        Add more paragraphs, links, images, or anything else you would like to
        publish.
      </p>
    </article>
  </main>

  <footer>
    &copy; 2026 wckdboy😈
  </footer>
</body>
</html>
